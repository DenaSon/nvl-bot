name: Python checks

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "feature/**"
  workflow_dispatch:
    inputs:
      full_root:
        description: "Run the entire test suite again as root"
        type: boolean
        default: true
  schedule:
    - cron: "15 1 * * *"

# A superseded PR run need not finish both test suites. Never cancel a
# master push or scheduled release gate mid-flight.
concurrency:
  group: python-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/python-checks.yml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp qrcode

      - name: Compile changed Python modules
        run: |
          python -m py_compile bot_final_v49-2.py v2ray_engine.py marzban_admin.py marzban_node_bootstrap.py marzban_node_install.py edge_observability.py checkhost_probe.py regional_probe_provider.py incident_observability.py standby_readiness.py marzban_asset_discovery.py marzban_local_health.py marzban_regional_filtering.py marzban_observability.py regional_filtering.py differential_filtering.py regional_probe_coordinator.py filtering_runtime.py safe_failover.py automatic_failover.py promote_standby_for_filtered_edge.py cloudflare_radar.py radar_context.py radar_runtime.py radar_notifications.py radar_ui.py incident_correlation.py
          python -m compileall -q server_migration

      - name: Select impacted tests from PR / push diff
        run: |
          python -B -m ops.ci_test_selector plan \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/nvl-ci-plan.json"

      - name: Run impacted tests (full suite nightly and on demand)
        run: python -B -m ops.ci_test_selector run --plan "$RUNNER_TEMP/nvl-ci-plan.json"

  root-release-safety:
    name: Release manifest and root safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of the main test job, for lower wall-clock latency.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/python-checks.yml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp qrcode

      - name: Select matching privileged safety tests
        run: |
          python -B -m ops.ci_test_selector plan \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/nvl-ci-plan.json"

      - name: Build and verify the pinned source release
        run: |
          NVL_COMMIT=$(git rev-parse HEAD)
          NVL_STAGE=$(mktemp -d "$RUNNER_TEMP/nvl-release-XXXXXX")
          echo "NVL_STAGE=$NVL_STAGE" >> "$GITHUB_ENV"
          python -B -m ops.k2_release_bundle build --repo . --commit "$NVL_COMMIT" --output "$NVL_STAGE/source.tar" | tee "$NVL_STAGE/build.log"
          NVL_PACKAGE_SHA=$(sed -n 's/^PACKAGE_MANIFEST_SHA256=//p' "$NVL_STAGE/build.log")
          test -n "$NVL_PACKAGE_SHA"
          mkdir "$NVL_STAGE/source"
          tar -xf "$NVL_STAGE/source.tar" -C "$NVL_STAGE/source"
          cd "$NVL_STAGE/source"
          python -B -m ops.k2_release_bundle verify --directory . --commit "$NVL_COMMIT" --package-sha256 "$NVL_PACKAGE_SHA"

      - name: Run impacted privileged tests (full nightly)
        run: |
          cd "$NVL_STAGE/source"
          sudo env NVL_CI_PLAN="$RUNNER_TEMP/nvl-ci-plan.json" \
            "$(command -v python)" -B - <<'PY'
          import os
          from ops.ci_test_selector import main

          os.umask(0o077)
          raise SystemExit(main([
              "run", "--plan", os.environ["NVL_CI_PLAN"], "--root"
          ]))
          PY
