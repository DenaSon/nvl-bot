name: Python checks

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "feature/**"

permissions:
  contents: read

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp qrcode

      - name: Compile changed Python modules
        run: |
          python -m py_compile bot_final_v49-2.py v2ray_engine.py marzban_admin.py marzban_node_bootstrap.py marzban_node_install.py edge_observability.py checkhost_probe.py regional_probe_provider.py incident_observability.py standby_readiness.py marzban_asset_discovery.py marzban_local_health.py marzban_regional_filtering.py marzban_observability.py regional_filtering.py differential_filtering.py regional_probe_coordinator.py filtering_runtime.py safe_failover.py automatic_failover.py promote_standby_for_filtered_edge.py cloudflare_radar.py radar_context.py radar_runtime.py radar_notifications.py radar_ui.py incident_correlation.py
          python -m compileall -q server_migration

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test the extracted release as root with private deployment umask
        run: |
          NVL_COMMIT=$(git rev-parse HEAD)
          NVL_STAGE=$(mktemp -d "$RUNNER_TEMP/nvl-release-XXXXXX")
          python -B -m ops.k2_release_bundle build --repo . --commit "$NVL_COMMIT" --output "$NVL_STAGE/source.tar" | tee "$NVL_STAGE/build.log"
          NVL_PACKAGE_SHA=$(sed -n 's/^PACKAGE_MANIFEST_SHA256=//p' "$NVL_STAGE/build.log")
          mkdir "$NVL_STAGE/source"
          tar -xf "$NVL_STAGE/source.tar" -C "$NVL_STAGE/source"
          cd "$NVL_STAGE/source"
          python -B -m ops.k2_release_bundle verify --directory . --commit "$NVL_COMMIT" --package-sha256 "$NVL_PACKAGE_SHA"
          sudo "$(command -v python)" -B -c 'import os, unittest; os.umask(0o077); result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("tests")); raise SystemExit(not result.wasSuccessful())'
