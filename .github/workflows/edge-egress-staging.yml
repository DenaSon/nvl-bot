name: Edge egress stage-only checks

on:
  pull_request:
    paths:
      - 'edge_egress_policy.py'
      - 'edge_egress_lifecycle.py'
      - 'edge_egress_handoff.py'
      - 'edge_egress_failover_guard.py'
      - 'edge_egress_protected_6g6h.py'
      - 'edge_egress_protected_mapping.py'
      - 'ops/labs/edge_egress_core_staging_preflight.py'
      - 'tests/test_edge_egress_core_staging_preflight.py'
      - 'tests/test_edge_egress_protected_mapping.py'
      - 'tests/test_edge_egress_protected_6g6h.py'
      - 'edge_egress_entrypoints.py'
      - 'edge_egress_inventory.py'
      - 'edge_egress_prepare.py'
      - 'edge_egress_6g_bridge.py'
      - 'edge_egress_status.py'
      - 'edge_egress_ssh_transport.py'
      - 'edge_egress_uid_policy.py'
      - 'edge_egress_uid_lifecycle.py'
      - 'edge_egress_uid_6g_bridge.py'
      - 'edge_egress_uid_kernel.py'
      - 'edge_egress_uid_shadow.py'
      - 'edge_egress_uid_boot.py'
      - 'edge_egress_uid_dns.py'
      - 'edge_egress_uid_recovery.py'
      - 'edge_egress_uid_systemd.py'
      - 'tests/test_edge_egress_uid_systemd.py'
      - 'tests/test_edge_egress_uid_boot.py'
      - 'tests/test_edge_egress_uid_dns.py'
      - 'tests/test_edge_egress_uid_recovery.py'
      - 'ops/edge_egress_host_worker.py'
      - 'tests/test_edge_egress_ssh_transport.py'
      - 'tests/test_edge_egress_uid_policy.py'
      - 'tests/test_edge_egress_uid_lifecycle.py'
      - 'tests/test_edge_egress_uid_6g_bridge.py'
      - 'tests/test_edge_egress_uid_kernel.py'
      - 'tests/test_edge_egress_uid_shadow.py'
      - 'bot_final_v49-2.py'
      - 'ops/edge_egress_provision.py'
      - 'ops/examples/edge_egress_stg1.json'
      - 'tests/test_edge_egress_stg1_profile.py'
      - 'ops/backup_nvl_host.sh'
      - 'tests/test_edge_egress_policy.py'
      - 'tests/test_edge_egress_bot_integration.py'
      - 'tests/test_edge_egress_handoff.py'
      - 'tests/test_edge_egress_shared_lock.py'
      - 'tests/test_edge_egress_manual_entrypoints.py'
      - 'tests/test_edge_egress_inventory.py'
      - 'tests/test_edge_egress_prepare.py'
      - 'tests/test_edge_egress_6g_bridge.py'
      - 'tests/test_edge_egress_status.py'
      - 'tests/test_edge_egress_provision.py'
      - 'tests/test_edge_egress_activation_sim.py'
      - 'tests/support/fake_egress_command.py'
      - '.github/workflows/edge-egress-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-regression:
    name: Stage-only safety regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independent Egress module syntax
        run: python -m compileall -q edge_egress_*.py ops/edge_egress_provision.py ops/edge_egress_host_worker.py ops/labs/edge_egress_core_staging_preflight.py tests/test_edge_egress_*.py tests/support/fake_egress_command.py
      - name: Main bot syntax (baseline requires Python 3.12+)
        if: matrix.python-version == '3.12'
        run: python -m py_compile bot_final_v49-2.py
      - name: Stage-only, failure injection and safety tests
        run: python -m unittest discover -s tests -p 'test_edge_egress_*.py' -v
      - name: Backup script shell syntax
        run: bash -n ops/backup_nvl_host.sh
